"$schema" = 'https://starship.rs/config-schema.json'

format = """
[ ](bg:color_bg0)\
$os\
$hostname\
[](bg:color_bg1 fg:color_bg0)\
$username\
[](bg:color_bg2 fg:color_bg1)\
$directory\
[](bg:color_bg3 fg:color_bg2)\
$git_branch\
$git_status\
[](fg:color_bg3)\
$line_break$character"""

palette = 'synth_blue'

[palettes.synth_blue]
color_bg0 = '#396bd7' # 'blue'
color_fg0 = '#ffffff' # 'white'
color_bg1 = '#709aed' # 'light-blue'
color_fg1 = '#ffffff' # '#e2eafb' # 'white'
color_bg2 = '#EBEBEB' # 'white'
color_fg2 = '#666666' # 'light-gray'
color_bg3 = '#666666' # 'dark-gray'
color_fg3 = '#bbbbbb' # 'light-gray'

[palettes.synth_orange]
color_bg0 = '#ff8700' # '208'
color_fg0 = '#2a2a2a' # 'black'
color_bg1 = '#d7af87' # '180'
color_fg1 = '#333333' # 'black'
color_bg2 = '#EBEBEB' # 'white'
color_fg2 = '#666666' # 'black'
color_bg3 = '#666666' # 'dark-gray'
color_fg3 = '#bbbbbb' # '208'

[palettes.synth_green]
color_bg0 = '#008000' # 'green'
color_fg0 = '#000000' # 'light-gray'
color_bg1 = '#87ff5f' # 'light-green'
color_fg1 = '#2a2a2a' # 'black'
color_bg2 = '#EBEBEB' # 'light-gray'
color_fg2 = '#666666' # 'dark-gray'
color_bg3 = '#666666' # 'dark-gray'
color_fg3 = '#bbbbbb' # 'light-gray'

[palettes.synth_gray]
color_bg0 = '#1f1f1f' # 'black'
color_fg0 = '#ffffff' # 'white'
color_bg1 = '#666666' # 'dark-gray'
color_fg1 = '#ffffff' # 'white'
color_bg2 = '#EBEBEB' # 'light-gray'
color_fg2 = '#666666' # 'black'
color_bg3 = '#666666' # 'dark-gray'
color_fg3 = '#bbbbbb' # 'light-gray'

[palettes.synth_magenta]
color_bg0 = '#FF00FF'
color_fg0 = '#2a2a2a'
color_bg1 = '#FF85FF'
color_fg1 = '#333333'
color_bg2 = '#EBEBEB'
color_fg2 = '#666666'
color_bg3 = '#666666'
color_fg3 = '#A3A3A3'

[palettes.synth_red]
color_bg0 = '#FF0000'
color_fg0 = '#2a2a2a'
color_bg1 = '#FF5C5C'
color_fg1 = '#333333'
color_bg2 = '#EBEBEB'
color_fg2 = '#666666'
color_bg3 = '#666666'
color_fg3 = '#A3A3A3'

[palettes.synth_yellow]
color_bg0 = '#FFFF00'
color_fg0 = '#2a2a2a'
color_bg1 = '#CCCC00'
color_fg1 = '#333333'
color_bg2 = '#EBEBEB'
color_fg2 = '#666666'
color_bg3 = '#666666'
color_fg3 = '#A3A3A3'

[os]
disabled = false
style = "bg:color_bg0 fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[hostname]
style = "bold bg:color_bg0 fg:color_fg0"
format = '[ $hostname ]($style)'

[username]
show_always = true
style_user = "bold bg:color_bg1 fg:color_fg1"
style_root = "bold bg:color_bg1 fg:color_fg1"
format = '[ $user ]($style)'

[directory]
style = "bold bg:color_bg2 fg:color_fg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bold bg:color_bg3"
format = '[ $symbol]($style)[ $branch ]($style)'

[git_status]
style = "bold bg:color_bg0"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_bg0)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_bg0)'
error_symbol = '[❯](bold fg:#FF0000)'
